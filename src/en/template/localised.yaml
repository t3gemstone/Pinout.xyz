- pin_desc_gpio: 'You can use this pin as a standard digital input or output. Use the `libgpiod` tools to control it. Look the GPIO up by the system name listed on the GPIO page rather than by its number.'
- pin_warning_gpio: 'This pin is connected directly to the processor and has no protection circuitry. Driving the pin with 5 V can damage the processor and the board, so use the pin for signals only. Do not connect loads such as LEDs, buzzers, relays or motors directly to the pin; use a suitable driver circuit, transistor or relay module for such loads.'
- pin_desc_i2c: 'This pin is one of the lines of the I2C interface reserved for connecting external devices. Pin 3 is the data line (SDA) and pin 5 is the clock line (SCL). The pull-up resistors required for the I2C bus are already on the board. You can run `ls /dev/i2c-*` to list the I2C buses. The bus number can vary depending on the software image in use.'
- pin_warning_i2c: 'Use only devices that support 3.3 V logic levels. Every device on the I2C bus must have a different address; using the same address on more than one device causes communication conflicts. The pull-up resistors required for the I2C bus are already on the board, so take them into account before adding external pull-up resistors.'
- pin_desc_hat_i2c: 'This pin is one of the two lines of the second I2C bus. The interface works the same way as the first I2C bus, but this bus is shared with other components on the board. The power management IC (PMIC), the real-time clock (RTC) and a memory chip (EEPROM) are connected to it internally. When connecting an external device, take the I2C addresses of the existing devices and any possible address conflicts on the bus into account.'
- pin_warning_hat_i2c: 'You can connect an external device to this I2C bus. Before connecting it, use `i2cdetect` to check the I2C addresses already present on the bus and choose an address that does not clash. Do not interfere with the connections or the configuration of the existing devices. This bus needs more care than pins 3 and 5. Because the power management IC (PMIC) is connected to the same bus, a short circuit or a jammed bus affects power management on the board and can stop the whole system from running. For general-purpose external devices, the I2C bus on pins 3 and 5 is recommended.'
- pin_desc_spi: 'This pin is one of the five pins of the SPI interface. Pin 19 sends data (MOSI), pin 21 receives data (MISO), pin 23 carries the clock signal (SCLK), and pins 24 and 26 are the chip select (CS) lines. Once the matching device tree overlay is enabled, the SPI interfaces appear in Linux as the `/dev/spidev0.0` and `/dev/spidev0.2` device files.'
- pin_warning_spi: 'The barometer and IMU sensors on the board share the data and clock lines with this SPI interface. The sensors have their own chip select lines, so there is no direct conflict with your device. However, your device must not drive the data line while its chip select is inactive, or sensor communication can be affected. Use only devices that support 3.3 V logic levels.'
- pin_desc_uart: 'These pins belong to the serial communication interface. Pin 8 is the transmit line (TX) and pin 10 is the receive line (RX). Pins 11 and 36 can be used as additional control lines for devices that need flow control. In Linux this serial port appears as the /dev/ttyS3 device. The three-pin UART connector on the back of the board is a separate serial port reserved for the boot console.'
- pin_warning_uart: 'Use only serial communication devices with 3.3 V logic levels. Do not connect these pins directly to an RS-232 interface or to a converter with 5 V logic levels; doing so can damage the board. Some device tree overlays can assign different functions to these pins. If the pins do not behave as expected, check the configuration in /boot/uEnv.txt.'
- pin_desc_pcm: 'These pins are part of the four lines of the digital audio interface. Both data lines can be configured as an input or an output in software. The direction of the data lines depends on the audio configuration in use.'
- pin_warning_pcm: 'A Raspberry Pi compatible audio HAT will physically fit, but the T3 Gemstone image must have a suitable driver for the HAT''s audio chip and the signal directions must be configured correctly. Check the documentation for the compatibility of the hardware and the image before buying an audio HAT.'
- pin_desc_3v3: 'This pin supplies 3.3 V. This voltage level matches the logic level used on the signal pins and can be used for sensors and low-power peripherals. The 3.3 V supply rail is shared with the M.2 slot and the camera, display and USB connectors on the board.'
- pin_warning_3v3: 'Do not power high-current loads such as motors, heaters, LED strips and servos from this pin; use an external power supply for such loads. Do not apply an external 3.3 V supply to pin 1 or pin 17. The board drives these pins as outputs, and applying an external supply can damage the power circuitry.'
- pin_desc_5v: 'This pin supplies 5 V for peripherals that need a supply voltage higher than the 3.3 V logic level. The supply voltage comes through the power regulator on the board rather than directly from the external power source. The signal pins, however, support 3.3 V logic levels only.'
- pin_warning_5v: 'Do not apply an external 5 V supply to the board through pin 2 or pin 4. These pins are 5 V outputs; applying an external voltage can damage the board''s power circuitry and disable the protection mechanisms on its power input. Use an external power supply for high-current loads such as motors, heaters, high-power LEDs and servos. When an external power supply is used, connect its ground to the board''s GND where required.'
- pin_desc_ground: 'This pin is connected to the board ground plane and provides the 0 V reference for power and logic signals. Using the GND pin nearest the signal line keeps the wiring tidier and easier to follow.'
