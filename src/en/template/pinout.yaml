---
# Signal assignments follow the T3 Gemstone O1 schematic, t3-gem-o1-v0_2.pdf,
# sheet 31, where the header is connector J23. The per-pin table is on the GPIO
# interface page.
name: T3 Gemstone O1 GPIO Pinout
pins:
  '1':
    name: 3v3 Power
    type: "+3v3"
  '2':
    name: 5v Power
    type: "+5v"
  '3':
    name: I2C-MCU0 SDA
    description: I2C-MCU0 data
    description_tr: I2C-MCU0 veri
    type: GPIO/I2C
    scheme:
      bcm: 2
  '4':
    name: 5v Power
    type: "+5v"
  '5':
    name: I2C-MCU0 SCL
    description: I2C-MCU0 clock
    description_tr: I2C-MCU0 saat
    type: GPIO/I2C
    scheme:
      bcm: 3
  '6':
    name: Ground
    type: GND
  '7':
    name: AUDIO REFCLK2
    description: audio reference clock
    description_tr: ses referans saati
    type: GPIO
    scheme:
      bcm: 4
  '8':
    name: UART-MAIN1 TX
    description: serial transmit
    description_tr: seri veri gönderme
    type: GPIO/UART
    scheme:
      bcm: 14
  '9':
    name: Ground
    type: GND
  '10':
    name: UART-MAIN1 RX
    description: serial receive
    description_tr: seri veri alma
    type: GPIO/UART
    scheme:
      bcm: 15
  '11':
    name: UART-MAIN1 RTS
    description: serial flow control, RTS
    description_tr: seri iletişim akış kontrolü, RTS
    type: GPIO/UART
    scheme:
      bcm: 17
  '12':
    name: PCM-McASP0 CLK
    description: audio bit clock
    description_tr: ses bit saati
    type: GPIO/PCM
    scheme:
      bcm: 18
  '13':
    name: ''
    type: GPIO
    scheme:
      bcm: 27
