- pin_desc_gpio: 'Bu pini standart bir dijital giriş veya çıkış olarak kullanabilirsiniz. Pini kontrol etmek için `libgpiod` araçlarını kullanabilirsiniz. GPIO’yu numarasıyla değil, GPIO sayfasında listelenen sistem adıyla arayabilirsiniz.'
- pin_warning_gpio: 'Bu pin doğrudan işlemciye bağlıdır ve herhangi bir koruma devresi içermez. Pinin 5 V ile sürülmesi işlemciye ve karta zarar verebilir. Bu nedenle pini yalnızca sinyal amaçlı kullanın. LED, buzzer, röle veya motor gibi yükleri doğrudan pine bağlamayın; bu tür yükler için uygun bir sürücü devresi, transistör veya röle modülü kullanın.'
- pin_desc_i2c: 'Bu pin, harici cihazların bağlantısı için ayrılmış I²C arayüzünün hatlarından biridir. Pin 3 veri (SDA), pin 5 ise saat (SCL) hattıdır. I²C hattı için gerekli pull-up dirençleri kart üzerinde bulunmaktadır. I²C veri yolunu görüntülemek için  ` ls /dev/i2c-* ` komutu kullanabilirsiniz. Veri yolu numarası, kullanılan yazılım imajına göre değişiklik gösterebilir.'
- pin_warning_i2c: 'Yalnızca 3,3 V lojik seviyesini destekleyen cihazları kullanın. I²C hattındaki her cihazın farklı bir adresi olmalıdır; aynı adresin birden fazla cihaz tarafından kullanılması iletişim çakışmalarına neden olabilir. Kart üzerinde I²C hattı için gerekli pull-up dirençleri zaten bulunmaktadır. Harici pull-up direnci eklemeden önce kart üzerindeki mevcut dirençleri göz önünde bulundurun.'
- pin_desc_hat_i2c: 'Bu pin, ikinci I²C veri yoluna ait iki hattan biridir. Arayüz, birinci I²C veri yolu ile aynı şekilde çalışır; ancak bu veri yolu kart üzerindeki diğer bileşenlerle paylaşılmaktadır. Güç yönetim entegresi (PMIC), gerçek zamanlı saat (RTC) ve bir bellek entegresi (EEPROM) bu hatta dahili olarak bağlıdır. Harici cihaz bağlarken mevcut cihazların I²C adreslerini ve veri yolu üzerindeki olası adres çakışmalarını göz önünde bulundurun.'
- pin_warning_hat_i2c: 'Bu I²C hattına harici bir cihaz bağlanabilir. Cihazı bağlamadan önce `i2cdetect` komutunu kullanarak veri yolundaki mevcut I²C adreslerini kontrol edin ve çakışmaya neden olmayacak bir adres seçin. Mevcut cihazların bağlantılarına veya yapılandırmalarına müdahale etmeyin. Pin 3 ve 5 e kıyasla bu hat üzerinde daha dikkatli çalışılmalıdır. Güç yönetim entegresinin (PMIC) aynı veri yoluna bağlı olması nedeniyle oluşabilecek bir kısa devre veya hattın kilitlenmesi, kart üzerindeki güç yönetimini etkileyerek sistemin tamamının çalışmasını durdurabilir. Genel amaçlı harici cihaz bağlantıları için pin 3 ve 5 te bulunan I²C veri yolunun kullanılması önerilir.'
- pin_desc_spi: 'Bu pin, SPI arayüzüne ait beş pindenden biridir. Pin 19 veri gönderimi (MOSI), pin 21 veri alımı (MISO), pin 23 saat sinyali (SCLK), pin 24 ve pin 26 ise yonga seçme (CS) hatları olarak kullanılır. İlgili Device Tree overlayi etkinleştirildiğinde SPI arayüzleri Linux üzerinde `/dev/spidev0.0` ve `/dev/spidev0.2` aygıt dosyaları olarak görünür.'
- pin_warning_spi: 'Kart üzerindeki barometre ve IMU sensörleri, veri ve saat hatlarını bu SPI arayüzüyle paylaşır. Sensörlerin ayrı chip-select hatları bulunduğundan cihazınızla doğrudan bir çakışma oluşmaz. Ancak cihazınızın chip-select hattı etkin değilken veri hattını sürmemesi gerekir; aksi durumda sensör iletişimi etkilenebilir. Yalnızca 3,3 V lojik seviyesini destekleyen cihazlar kullanın.'
- pin_desc_uart: 'Bu pinler seri haberleşme arayüzüne aittir. Pin 8 gönderim (TX), pin 10 alım (RX) hattıdır. Pin 11 ve pin 36, akış kontrolüne ihtiyaç duyan cihazlar için ek kontrol hatları olarak kullanılabilir. Linux üzerinde bu seri port /dev/ttyS3 aygıtı olarak görünür. Kartın arka kısmındaki üç pinli UART konnektörü, açılış konsolu için ayrılmış farklı bir seri porttur.'
- pin_warning_uart: 'Yalnızca 3,3 V lojik seviyeli seri haberleşme cihazları kullanın. Bu pinleri RS-232 arayüzüne veya 5 V lojik seviyeli bir dönüştürücüye doğrudan bağlamayın; bu durum karta zarar verebilir. Bazı Device Tree overlay''leri bu pinlere farklı işlevler atayabilir. Pinler beklenen şekilde çalışmıyorsa /boot/uEnv.txt dosyasındaki yapılandırmayı kontrol edin.'
- pin_desc_pcm: 'Bu pinler, dijital ses arayüzüne ait dört hattın bir parçasıdır. Her iki veri hattı da yazılım üzerinden giriş veya çıkış olarak yapılandırılabilir. Veri hatlarının yönü, kullanılan ses yapılandırmasına bağlıdır.'
- pin_warning_pcm: 'Raspberry Pi uyumlu bir ses HAT''i fiziksel olarak takılabilir; ancak HAT''in ses yongası için T3 Gemstone imajında uygun bir sürücü bulunması ve sinyal yönlerinin doğru şekilde yapılandırılması gerekir. Ses HAT''i satın almadan önce ilgili donanımın ve imajın uyumluluğunu dokümantasyondan kontrol edin.'
- pin_desc_3v3: 'Bu pin, 3,3 V besleme sağlar. Bu gerilim seviyesi, sinyal pinlerinde kullanılan lojik seviyeye uygundur ve sensörler ile düşük güç tüketimli çevre birimleri için kullanılabilir. 3,3 V besleme hattı kart üzerindeki M.2 yuvası, kamera, ekran ve USB konnektörleriyle ortak olarak kullanılır.'
- pin_warning_3v3: 'Motor, ısıtıcı, LED şeridi ve servo gibi yüksek akım gerektiren yükleri bu pinden beslemeyin; bu yükler için harici bir güç kaynağı kullanın. Pin 1 veya pin 17''ye harici 3,3 V besleme uygulamayın. Bu pinler kart tarafından çıkış olarak sürülür ve harici bir besleme uygulanması güç devresinde hasara neden olabilir.'
- pin_desc_5v: 'Bu pin, 3,3 V lojik seviyesinden daha yüksek besleme gerilimine ihtiyaç duyan çevre birimleri için 5 V besleme sağlar. Besleme gerilimi, harici güç kaynağından doğrudan değil, kart üzerindeki güç regülatörü üzerinden sağlanır. Sinyal pinleri ise yalnızca 3,3 V lojik seviyesini destekler.'
- pin_warning_5v: 'Pin 2 veya pin 4 üzerinden karta harici 5 V besleme uygulamayın. Bu pinler 5 V çıkışıdır; harici gerilim uygulanması kartın güç devresine zarar verebilir ve güç girişindeki koruma mekanizmalarını devre dışı bırakabilir. Motor, ısıtıcı, yüksek güçlü LED ve servo gibi yüksek akım gerektiren yükler için harici bir güç kaynağı kullanın. Harici güç kaynağı kullanıldığında, gerekli durumlarda güç kaynağının toprak hattını kartın GND hattına bağlayın.'
- pin_desc_ground: 'Bu pin, kartın toprak düzlemine bağlıdır ve güç ile lojik sinyaller için 0 V referansı sağlar. Kablolama sırasında sinyal hattına en yakın GND pininin kullanılması, bağlantıların daha düzenli ve anlaşılır olmasını sağlar.'