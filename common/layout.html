<!doctype html>
<html lang="{{langcode}}">
	<head>
		<meta http-equiv="content-type" content="text/html;charset=utf-8" />
		<title>{{title}}</title>
		<meta name="description" content="{{description}}" />
		<meta name="viewport" content="width=device-width, initial-scale=1"></meta>
		<link href="{{resource_url}}pinout.css?v={{v}}" rel="stylesheet">
		<link href="{{resource_url}}print.css?v={{v}}" rel="stylesheet" media="print">
		{{hreflang}}
		<link rel="icon" href="{{resource_url}}gemstone-mark-dark.png" type="image/png">
		<meta name="generator" content="Gemstone Pinout, based on Pinout.xyz @ https://github.com/pinout-xyz/pinout.xyz, timestamp: {{v}}"/>
		<!-- Build: {{v}} -->
		{{opengraph}}
	</head>
	<body class="{{body_class}}">
		<a class="skip-link" href="#content">{{strings:skip_to_content}}</a>
		<header>
			<div class="logo"><a title="{{strings:site_name}}" href="{{settings:site_url}}/">
				<img class="logo-on-light" src="{{resource_url}}gemstone-logo-dark.png" width="640" height="159" alt="{{strings:site_name}}" />
				<img class="logo-on-dark" src="{{resource_url}}gemstone-logo-light.png" width="640" height="159" alt="" />
			</a></div>
			<div class="header-actions">
				<button id="theme-toggle" type="button" aria-label="{{strings:theme_toggle}}" title="{{strings:theme_toggle}}">
					<svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.4A8.5 8.5 0 0 1 8.6 3.5 8.5 8.5 0 1 0 20.5 15.4Z"/></svg>
					<svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
				</button>
				{{lang_links}}
			</div>
		</header>
		<main>
			{{main_content}}
		</main>
		<footer>
			{{footer}}
		</footer>
		<script type="text/javascript" src="//cdnjs.cloudflare.com/ajax/libs/prettify/r298/prettify.min.js"></script>
		<script src='{{resource_url}}pinout.js?v={{v}}'></script>
		<script src='{{resource_url}}boards.js?v={{v}}'></script>
</body>
</html>
